name: release

# Triggers on any tag matching v* (e.g. v0.1.0, v1.2.3-rc1).
# Do NOT push v* tags manually for testing — use `goreleaser release --snapshot`
# locally instead (see Makefile target `release-snapshot`).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release and upload assets

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout (full history so goreleaser can derive the git tag) ──
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Go toolchain ──────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      # ── 3. Zig (cross-compiler for CGO) ──────────────────────────────────
      # zig-cc is used as a universal cross-compiler for all CGO targets
      # (darwin, linux/musl, windows). See .goreleaser.yml for per-target triples.
      #
      # goto-bus-stop/setup-zig installs a pinned Zig release from ziglang.org
      # and adds it to PATH. Any Zig 0.12+ works; pin to a specific release for
      # reproducible builds.
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.13.0'

      # ── 3.5. Stage zig-cc wrappers in an absolute PATH-resolvable location ─
      # Two requirements:
      #   1. Git on Windows authors does not preserve the +x bit, so we chmod
      #      after checkout.
      #   2. Go 1.25+ refuses relative CC/CXX (`go: CC environment variable is
      #      relative; must be absolute path`). Copying the wrappers to
      #      /usr/local/bin/ gives them an absolute, PATH-resolvable path so
      #      `.goreleaser.yml` can refer to them by basename.
      - name: install zigcc wrappers
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          sudo install -m 0755 scripts/zigcc-linux-amd64.sh     /usr/local/bin/zigcc-linux-amd64
          sudo install -m 0755 scripts/zigcc-linux-arm64.sh     /usr/local/bin/zigcc-linux-arm64
          sudo install -m 0755 scripts/zigcc-windows-amd64.sh   /usr/local/bin/zigcc-windows-amd64
          sudo install -m 0755 scripts/zigcxx-linux-amd64.sh    /usr/local/bin/zigcxx-linux-amd64
          sudo install -m 0755 scripts/zigcxx-linux-arm64.sh    /usr/local/bin/zigcxx-linux-arm64
          sudo install -m 0755 scripts/zigcxx-windows-amd64.sh  /usr/local/bin/zigcxx-windows-amd64
          which zigcc-linux-amd64 zigcxx-linux-amd64

      # ── 4. Verify goreleaser config before building ───────────────────────
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      # ── 5. Run GoReleaser (build + publish) ──────────────────────────────
      # GITHUB_TOKEN — built-in; grants release write permission.
      #
      # --parallelism 1 forces goreleaser to build one target at a time. zig
      # 0.13's compile-id cache directory is not safe under concurrent
      # invocation even with per-target ZIG_LOCAL_CACHE_DIR — multiple .c
      # translation units per target invoke separate zig processes that race
      # within the same target's cache. Going serial removes the race entirely
      # at the cost of ~2× build time. Total runtime stays under 6 minutes.
      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
